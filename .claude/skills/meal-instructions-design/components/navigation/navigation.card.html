<!DOCTYPE html><html><head><meta charset="utf-8"><title>Navigation components</title><link rel="stylesheet" href="../../styles.css">

<style>body{margin:0;padding:16px;background:var(--paper)}.k{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-subtle);margin:14px 0 6px}.k:first-child{margin-top:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.MealInstructionsDesignSystem_767cb5; const D = window.MI_DATA;
const { Navbar, Footer, SearchModal, ConsentBanner } = DS;
function Demo(){ const [open,setOpen]=React.useState(false); const [active,setActive]=React.useState('/how-long');
  return <div style={{margin:-16}}>
    <Navbar activeHref={active} onNavigate={setActive} onSearch={()=>setOpen(true)} sticky={false} recipeCount={D.recipeCount} datasheetCount={D.datasheetCount} />

    <div style={{padding:16}}><div className="k">ConsentBanner (inline)</div><ConsentBanner fixed={false} /></div>
    <div style={{padding:16}}><div className="k">Footer</div></div><Footer datasheetCount={D.datasheetCount} style={{marginTop:0}} />
    <SearchModal isOpen={open} onClose={()=>setOpen(false)} items={D.searchItems} />
  </div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);</script></body></html>
