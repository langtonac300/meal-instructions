<!DOCTYPE html><html><head><meta charset="utf-8"><title>Accent — terracotta</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--accent);border-color:var(--accent)"></div><div class="lbl"><b>--accent</b><span class="hex">#C84B2C</span></div></div><div class="sw"><div class="chip" style="background:var(--accent-dark);border-color:var(--accent-dark)"></div><div class="lbl"><b>--accent-dark (hover)</b><span class="hex">#A5371C</span></div></div><div class="sw"><div class="chip" style="background:var(--accent-light);"></div><div class="lbl"><b>--accent-light</b><span class="hex">#F7EEEA</span></div></div><div class="sw"><div class="chip" style="background:var(--accent-10);"></div><div class="lbl"><b>--accent-10</b><span class="hex">rgba(200,75,44,.10)</span></div></div><div class="sw"><div class="chip" style="background:var(--accent-20);"></div><div class="lbl"><b>--accent-20 (ring)</b><span class="hex">rgba(200,75,44,.20)</span></div></div><div class="sw"><div class="chip" style="background:var(--logo-dot);border-color:var(--logo-dot)"></div><div class="lbl"><b>--logo-dot</b><span class="hex">#EA580C (logo only)</span></div></div></div></body></html>
