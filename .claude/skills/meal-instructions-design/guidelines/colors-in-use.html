<!-- @dsCard group="Colors" viewport="700x150" name="Color in use" subtitle="Ink for structure, accent for the one live number, emerald for the trust stamp." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Color in use</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--font-mono)">
<div style="background:var(--paper);border:1px solid var(--hairline);padding:12px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-subtle);font-weight:600">Cook Temp</div><div style="font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--accent);margin-top:14px">400°F (204°C)</div><div style="font-size:9px;color:var(--ink-muted);margin-top:2px">Preheat Required</div></div>
<div style="background:var(--paper);border:1px solid var(--hairline);padding:12px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-subtle);font-weight:600">Total Time</div><div style="font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin-top:14px">24 MIN</div><div style="font-size:9px;color:var(--ink-muted);margin-top:2px">Floor-to-Plate</div></div>
<div style="display:flex;flex-direction:column;gap:6px;justify-content:center"><span style="align-self:flex-start;padding:2px 10px;background:var(--paper);border:1px solid var(--hairline);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--verified-strong)">VERIFIED NO-FLUFF</span><span style="align-self:flex-start;padding:2px 10px;background:var(--ink);color:var(--paper);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700">≤ 15 MINS TOTAL</span><span style="align-self:flex-start;padding:2px 8px;background:var(--accent);color:#fff;border-radius:4px;font-size:10px;font-weight:700">PROTEIN: CHICKEN</span></div>
<div style="background:var(--ink);color:var(--paper);padding:12px;border-radius:8px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700">WHY WE EXIST</div><div style="font-family:var(--font-sans);font-weight:700;font-size:13px;text-transform:uppercase;line-height:1.2;margin-top:6px">NO 5-PAGE ADS.</div></div></div></body></html>
