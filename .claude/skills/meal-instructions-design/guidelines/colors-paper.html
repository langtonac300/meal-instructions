<!-- @dsCard group="Colors" viewport="700x140" name="Paper surfaces" subtitle="Warm ground → card → inset → deep. The page is never white." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Paper surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--paper);"></div><div class="lbl"><b>--paper / ground</b><span class="hex">#F5F4F0</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-50);"></div><div class="lbl"><b>--paper-50 / card</b><span class="hex">#FAF9F6</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-200);"></div><div class="lbl"><b>--paper-200 / inset</b><span class="hex">#ECE9E1</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-300);"></div><div class="lbl"><b>--paper-300</b><span class="hex">#DED9CD</span></div></div><div class="sw"><div class="chip" style="background:var(--hairline);"></div><div class="lbl"><b>--hairline</b><span class="hex">#DFDCCE</span></div></div></div></body></html>
