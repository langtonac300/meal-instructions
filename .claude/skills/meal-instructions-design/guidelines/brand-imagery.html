<!DOCTYPE html><html><head><meta charset="utf-8"><title>Imagery</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div style="display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;height:168px">
<div style="position:relative;border:1px solid var(--hairline);border-radius:4px;overflow:hidden;background:var(--paper-200)"><img src="../assets/images/hero/smash-burger.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>
<div style="position:relative;border:1px solid var(--hairline);overflow:hidden;background:var(--paper-200)"><img src="../assets/images/categories/15-minute-skillet.jpg" style="width:100%;height:100%;object-fit:cover;display:block"><div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(17,17,17,.7),rgba(17,17,17,.2),transparent)"></div><span style="position:absolute;left:8px;bottom:8px;font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--paper);background:rgba(17,17,17,.8);padding:2px 6px;border-radius:4px">31 Meals</span></div>
<div style="border:1px solid var(--hairline);overflow:hidden;background:var(--paper-200)"><img src="../assets/images/recipes/air-fryer-crispy-chicken-tenders.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div>
<div style="border:1px solid var(--hairline);overflow:hidden;background:var(--paper-200)"><img src="../assets/images/appliances/air-fryer.jpg" style="width:100%;height:100%;object-fit:cover;display:block"></div></div></body></html>
