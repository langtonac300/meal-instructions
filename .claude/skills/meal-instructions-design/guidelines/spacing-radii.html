<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Square by default on recipe/datasheet surfaces; 4px on home controls; 8px on timer, modal, dark strip; full on dots." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Corner radii</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row"><div class="sw"><div style="height:56px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:0"></div><div class="lbl"><b>0</b>square — recipe cards, spec cells, buttons</div></div><div class="sw"><div style="height:56px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px"></div><div class="lbl"><b>4px</b>rounded — home pills, cards, inputs</div></div><div class="sw"><div style="height:56px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:6px"></div><div class="lbl"><b>6px</b>rounded-md — mode buttons</div></div><div class="sw"><div style="height:56px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:8px"></div><div class="lbl"><b>8px</b>rounded-lg — timer, search modal, manifesto</div></div><div class="sw"><div style="height:56px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:9999px"></div><div class="lbl"><b>9999px</b>full — dots, step numbers</div></div></div></body></html>
