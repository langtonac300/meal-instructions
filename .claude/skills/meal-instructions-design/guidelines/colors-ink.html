<!-- @dsCard group="Colors" viewport="700x140" name="Ink" subtitle="Text ramp. Body is pure ink; chrome steps down to muted and subtle." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ink</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ink);border-color:var(--ink)"></div><div class="lbl"><b>--ink</b><span class="hex">#111111</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-light);border-color:var(--ink-light)"></div><div class="lbl"><b>--ink-light</b><span class="hex">#2A2A2A</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-muted);border-color:var(--ink-muted)"></div><div class="lbl"><b>--ink-muted</b><span class="hex">#5A5854</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-subtle);border-color:var(--ink-subtle)"></div><div class="lbl"><b>--ink-subtle</b><span class="hex">#8E8A82</span></div></div><div class="sw"><div class="chip" style="background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em">INK ON PAPER</div><div class="lbl"><b>inverse panel</b><span class="hex">bg-ink text-paper</span></div></div></div></body></html>
