<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card anatomy</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-family:var(--font-mono)">
<div style="background:var(--paper-50);border:1px solid var(--hairline);padding:16px"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-subtle);font-weight:600;display:flex;justify-content:space-between"><span>Total Time</span><span class="lean-icon" style="--icon:url(../assets/icons/lean5s/clock.svg);width:20px;height:20px;color:var(--ink)"></span></div><div style="font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:8px">24 MIN</div><div style="font-size:9px;color:var(--ink-muted)">Floor-to-Plate</div><div class="lbl" style="margin-top:14px">bg-paper-card · hairline · square</div></div>
<div style="background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px;box-shadow:var(--shadow-subtle);padding:10px 12px;display:flex;align-items:center;gap:10px"><span class="lean-icon" style="--icon:url(../assets/icons/lean5s/protein-chicken.svg);width:20px;height:20px;color:var(--ink-muted)"></span><div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">Chicken <span style="font-size:10px;background:var(--paper-200);color:var(--ink-subtle);padding:1px 4px;border-radius:4px">22</span></div><div style="font-size:9px;text-transform:uppercase;color:var(--ink-muted);opacity:.7">Poultry</div></div></div>
<div style="background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:4px;box-shadow:var(--shadow-sm);padding:10px 12px;display:flex;align-items:center;gap:10px"><span class="lean-icon" style="--icon:url(../assets/icons/lean5s/protein-beef.svg);width:20px;height:20px;color:var(--accent)"></span><div><div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">Beef <span style="font-size:10px;background:var(--accent);color:#fff;padding:1px 4px;border-radius:4px">25</span></div><div style="font-size:9px;text-transform:uppercase;opacity:.7">Steaks &amp; Ground</div></div></div></div></body></html>
