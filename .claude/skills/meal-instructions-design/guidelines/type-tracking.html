<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tracking scale</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;color:var(--ink)">
<div><span style="letter-spacing:-.04em">tightest -0.04em SPECIFICATION</span></div><div><span style="letter-spacing:.04em">wide 0.04em SPECIFICATION</span></div>
<div><span style="letter-spacing:-.02em">tighter -0.02em SPECIFICATION</span></div><div><span style="letter-spacing:.08em">wider 0.08em SPECIFICATION</span></div>
<div><span style="letter-spacing:-.01em">tight -0.01em SPECIFICATION</span></div><div><span style="letter-spacing:.14em">widest 0.14em SPECIFICATION</span></div>
<div><span style="letter-spacing:0">normal 0 SPECIFICATION</span></div><div><span style="letter-spacing:.18em">architectural 0.18em SPECIFICATION</span></div></div></body></html>
