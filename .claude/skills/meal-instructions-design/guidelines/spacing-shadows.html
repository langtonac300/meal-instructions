<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Barely-there. Hairlines do the structural work; shadows only lift floating UI." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row" style="gap:20px;padding:6px"><div class="sw"><div style="height:64px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px;box-shadow:var(--shadow-subtle)"></div><div class="lbl"><b>subtle</b>0 1px 3px 3% · hero stats, cards</div></div><div class="sw"><div style="height:64px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px;box-shadow:var(--shadow-card)"></div><div class="lbl"><b>card</b>0 4px 12px 4% · card hover</div></div><div class="sw"><div style="height:64px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px;box-shadow:var(--shadow-float)"></div><div class="lbl"><b>float</b>0 12px 32px 8% · timer, ⌘K modal</div></div><div class="sw"><div style="height:64px;background:var(--paper-50);border:1px solid var(--hairline);border-radius:4px;box-shadow:var(--shadow-sm)"></div><div class="lbl"><b>sm</b>0 1px 2px 5% · active chips</div></div></div></body></html>
