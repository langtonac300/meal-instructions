<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — verified / caution / info" subtitle="Emerald = USDA verified & safety. Amber = paused / pressure release. Blue = from-frozen state, storage. Red = errors only." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic — verified / caution / info</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--verified);border-color:var(--verified)"></div><div class="lbl"><b>--verified</b><span class="hex">#047857</span></div></div><div class="sw"><div class="chip" style="background:var(--verified-strong);border-color:var(--verified-strong)"></div><div class="lbl"><b>--verified-strong</b><span class="hex">#065F46</span></div></div><div class="sw"><div class="chip" style="background:var(--verified-soft);"></div><div class="lbl"><b>--verified-soft</b><span class="hex">#D1FAE5</span></div></div><div class="sw"><div class="chip" style="background:var(--caution);border-color:var(--caution)"></div><div class="lbl"><b>--caution</b><span class="hex">#D97706</span></div></div><div class="sw"><div class="chip" style="background:var(--caution-soft);"></div><div class="lbl"><b>--caution-soft</b><span class="hex">#FEF3C7</span></div></div><div class="sw"><div class="chip" style="background:var(--info);border-color:var(--info)"></div><div class="lbl"><b>--info</b><span class="hex">#1D4ED8</span></div></div><div class="sw"><div class="chip" style="background:var(--info-soft);"></div><div class="lbl"><b>--info-soft</b><span class="hex">#EFF6FF</span></div></div><div class="sw"><div class="chip" style="background:var(--danger-text);border-color:var(--danger-text)"></div><div class="lbl"><b>--danger-text</b><span class="hex">#B91C1C</span></div></div></div></body></html>
