<!DOCTYPE html><html><head><meta charset="utf-8"><title>Big numbers & countdowns</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-sans);color:var(--ink)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0}.chip{height:64px;border:1px solid var(--hairline)}.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:6px;line-height:1.4}.lbl b{color:var(--ink);display:block;font-weight:700}.hex{color:var(--ink-subtle)}</style></head><body><div style="display:flex;align-items:flex-end;gap:32px;font-family:var(--font-mono);letter-spacing:-.01em">
<div><div style="font-size:48px;font-weight:900;color:var(--ink);line-height:1">12:00</div><div class="lbl">timer — 5xl 900</div></div>
<div><div style="font-size:30px;font-weight:700;color:var(--accent);line-height:1">06:00</div><div class="lbl">finished — accent</div></div>
<div><div style="font-size:20px;font-weight:900;color:var(--ink);line-height:1">400°F</div><div class="lbl">telemetry — xl 900</div></div>
<div><div style="font-size:18px;font-weight:700;color:var(--ink);line-height:1">10–12 min</div><div class="lbl">spec cell — lg 700</div></div>
<div><div style="font-size:14px;font-weight:700;color:var(--accent);line-height:1">42g</div><div class="lbl">table — accent bold</div></div></div></body></html>
